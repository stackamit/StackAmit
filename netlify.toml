[build]
  base='client'
  command='npm run build'
  publish='dist'

[[redirects]]
  from='/'
  to='index.html'
  status=200

# Long-term caching for hashed build assets (safe: Vite fingerprints every filename)
[[headers]]
  for = '/assets/*'
  [headers.values]
    Cache-Control = 'public, max-age=31536000, immutable'

# HTML should revalidate so users always get fresh deploys
[[headers]]
  for = '/index.html'
  [headers.values]
    Cache-Control = 'public, max-age=0, must-revalidate'
