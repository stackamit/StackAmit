[build]
  base='client'
  command='npm run build'
  publish='dist'

[[redirects]]
  from='/'
  to='index.html'
  status=200

# Long-term caching for hashed build assets (safe: Vite fingerprints every filename)
[[headers]]
  for = '/assets/*'
  [headers.values]
    Cache-Control = 'public, max-age=31536000, immutable'

# HTML should revalidate so users always get fresh deploys
[[headers]]
  for = '/index.html'
  [headers.values]
    Cache-Control = 'public, max-age=0, must-revalidate'

# SA-031: baseline hardening headers applied to every response.
# Non-breaking for the SPA (no enforcing CSP here - see remediation report);
# the JSON API already serves a strict CSP via helmet on the Render backend.
[[headers]]
  for = '/*'
  [headers.values]
    X-Content-Type-Options = 'nosniff'
    X-Frame-Options = 'DENY'
    Referrer-Policy = 'strict-origin-when-cross-origin'
    Permissions-Policy = 'geolocation=(), microphone=(), camera=(), payment=()'
    Strict-Transport-Security = 'max-age=31536000; includeSubDomains; preload'
